name: Set admin

# Manual: grants (or revokes) access to the admin panel for an existing user.
on:
  workflow_dispatch:
    inputs:
      email:
        description: "E-mail of the user (must exist in Firebase Authentication)"
        required: true
      revoke:
        description: "Revoke instead of grant"
        type: boolean
        default: false

jobs:
  set-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/functions/package-lock.json

      - name: Resolve project id
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then echo "::error::Secret GOOGLE_SERVICES_JSON_BASE64 is not set."; exit 1; fi
          echo "GOOGLE_CLOUD_PROJECT=$(echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode | jq -r '.project_info.project_id')" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Inputs go through env vars, never interpolated into the script.
      - name: Set admin
        working-directory: backend/functions
        env:
          EMAIL: ${{ inputs.email }}
          REVOKE: ${{ inputs.revoke }}
        run: |
          npm ci
          npm run build
          args=(--email "$EMAIL")
          if [ "$REVOKE" = "true" ]; then args+=(--revoke); fi
          npm run set-admin -- "${args[@]}"
