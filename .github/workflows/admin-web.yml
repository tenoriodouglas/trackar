name: Admin web CI/CD

# Admin panel (web/admin) on Firebase Hosting: https://<project>.web.app
# - PR / push: typecheck, tests, build.
# - Push to main / manual: deploy.
on:
  push:
    branches: [main]
    paths:
      - "web/admin/**"
      - "firebase.json"
      - ".github/workflows/admin-web.yml"
  pull_request:
    paths:
      - "web/admin/**"
      - "firebase.json"
      - ".github/workflows/admin-web.yml"
  workflow_dispatch:

concurrency:
  group: admin-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web/admin
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: admin-dist
          path: web/admin/dist
          retention-days: 1

  deploy:
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: admin-web-deploy
      cancel-in-progress: false
    env:
      HAS_SECRETS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_SECRETS != 'true'
        run: echo "::warning::Deploy skipped. Set secrets FIREBASE_SERVICE_ACCOUNT and GOOGLE_SERVICES_JSON_BASE64."

      - uses: actions/checkout@v7
        if: env.HAS_SECRETS == 'true'

      - uses: actions/download-artifact@v8
        if: env.HAS_SECRETS == 'true'
        with:
          name: admin-dist
          path: web/admin/dist

      - name: Resolve project id
        if: env.HAS_SECRETS == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: echo "PROJECT_ID=$(echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode | jq -r '.project_info.project_id')" >> "$GITHUB_ENV"

      - uses: google-github-actions/auth@v3
        if: env.HAS_SECRETS == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v7
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: "22"

      # Hosting serves /__/firebase/init.json from the project's web app; create it once.
      - name: Ensure Firebase web app
        if: env.HAS_SECRETS == 'true'
        run: |
          npm install -g firebase-tools
          count=$(firebase apps:list WEB --project "$PROJECT_ID" --json | jq '.result | length')
          if [ "$count" = "0" ]; then
            firebase apps:create WEB "Trackar Admin" --project "$PROJECT_ID" --non-interactive
          fi

      - name: Deploy hosting
        if: env.HAS_SECRETS == 'true'
        run: |
          firebase deploy --only hosting --project "$PROJECT_ID" --non-interactive
          echo "### Admin panel: https://${PROJECT_ID}.web.app" >> "$GITHUB_STEP_SUMMARY"
