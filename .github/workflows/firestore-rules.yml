name: Deploy Firestore rules

# Publishes firebase/firestore.rules and indexes on change in main (or manually).
# Secrets: FIREBASE_SERVICE_ACCOUNT (service account JSON) and GOOGLE_SERVICES_JSON_BASE64 (project id source).
on:
  push:
    branches: [main]
    paths:
      - "firebase/**"
      - "firebase.json"
      - ".github/workflows/firestore-rules.yml"
  workflow_dispatch:

concurrency:
  group: firestore-rules
  cancel-in-progress: false

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Graceful degradation: without secrets the job is skipped with a warning instead of failing.
      HAS_SECRETS: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_SECRETS != 'true'
        run: echo "::warning::Deploy skipped. Set secrets FIREBASE_SERVICE_ACCOUNT and GOOGLE_SERVICES_JSON_BASE64."

      - uses: actions/checkout@v7
        if: env.HAS_SECRETS == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_SECRETS == 'true'
        with:
          node-version: "22"

      - name: Install Firebase CLI
        if: env.HAS_SECRETS == 'true'
        run: npm install -g firebase-tools

      - name: Resolve project id
        if: env.HAS_SECRETS == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON_BASE64 is not set."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/google-services.json"
          project_id=$(jq -r '.project_info.project_id' "$RUNNER_TEMP/google-services.json")
          echo "FIREBASE_PROJECT_ID=$project_id" >> "$GITHUB_ENV"

      # Service-account auth: `firebase login:ci` tokens are deprecated.
      - name: Write service account key
        if: env.HAS_SECRETS == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT is not set (Firebase Console > Project settings > Service accounts > Generate new private key)."
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy rules and indexes
        if: env.HAS_SECRETS == 'true'
        run: firebase deploy --only firestore --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Remove credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
